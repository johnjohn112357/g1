services:
  - type: web
    name: global-intelligence-watch
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GIW_BACKGROUND_COLLECTOR
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: giw-intelligence-db
          property: connectionString
databases:
  - name: giw-intelligence-db
    plan: free
    region: frankfurt
    databaseName: giw_intelligence_db
    user: giw_intelligence_db_user
