name: Validate GIW
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q app.py collector.py intelligence.py scripts tests
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tests/check_frontend.py
      - run: node --check /tmp/giw-inline.js
      - run: python -c "import app; print('Flask routes:', sorted(str(r) for r in app.app.url_map.iter_rules()))"
